        type: string
    type: object
  api.eventEnvelope:
    properties:
      event:
        $ref: '#/definitions/api.eventDTO'
    type: object
  api.eventsEnvelope:
    properties:
      events:
        items:
          $ref: '#/definitions/api.eventDTO'
        type: array
