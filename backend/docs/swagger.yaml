  api.liveAdminSnapshotDTO:
    properties:
      answersHidden:
        type: boolean
      blanked:
        type: boolean
      currentQuestionId:
        type: string
      interactionsEnabled:
        type: boolean
      message:
        type: string
      namesHidden:
        type: boolean
      presentDensityMode:
        type: string
      qaInbox:
        items:
          $ref: '#/definitions/api.liveQAMessageDTO'
        type: array
      revealed:
        additionalProperties:
          items:
            type: string
          type: array
        description: |-
          Revealed mapeia questionID (string) -> participantIDs (string) já
          revelados nessa pergunta — deixa o painel do organizador retomar de
          onde parou depois de um F5 ou ao reabrir /stage, em vez de sempre
          recomeçar do zero.
        type: object
    type: object
  api.liveEntrarResponse:
    properties:
      role:
        description: |-
          Role: "participant" (já respondeu, com e-mail reconhecido) ou
          "observer" (só assiste).
        type: string
      token:
        description: |-
          Token de visitante (JWT) — usado como "?token=" nas rotas
