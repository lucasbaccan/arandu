        type: string
    type: object
  api.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  api.okResponse:
    properties:
      ok:
        type: boolean
    type: object
  api.participantResponseDTO:
    properties:
      answers:
        items:
          $ref: '#/definitions/api.answerDTO'
        type: array
      createdAt:
        type: string
      editToken:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      photo:
        type: string
    type: object
  api.pinResolvidoResponse:
    properties:
      id:
        type: string
    type: object
  api.publicAnswerDTO:
    properties:
      optionId:
        type: string
      questionId:
        type: string
      text:
        type: string
    type: object
  api.publicEventDTO:
    properties:
      allowEdit:
        type: boolean
      answersOpen:
        type: boolean
      id:
