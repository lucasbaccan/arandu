          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: sem foto
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: Serve a foto de um participante
      tags:
      - fotos
  /api/publico/eventos/{id}:
    get:
      description: Público, sem sessão — usado por /responder/{id} antes de enviar
        as respostas.
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.publicoEventoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: Busca um evento e suas perguntas (visão pública)
      tags:
      - publico
  /api/publico/eventos/{id}/ao-vivo/entrar:
    post:
      consumes:
      - application/json
      description: Público, sem sessão. PIN errado nunca autoriza. E-mail de quem
        já respondeu vira "participant"; e-mail em branco ou de quem não respondeu
        vira "observer" (só assiste). O token devolvido é usado como "?token=" nas
        demais rotas /ao-vivo/* públicas.
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: PIN e e-mail (opcional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.liveJoinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.liveEntrarResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: PIN inválido
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: Entra na apresentação ao vivo com PIN (+ e-mail opcional)
      tags:
      - ao-vivo (público)
  /api/publico/eventos/{id}/ao-vivo/estado:
    get:
      description: Equivalente sem streaming de GET /ao-vivo/fluxo (público).
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Token de visitante
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.liveSnapshotDTO'
        "401":
          description: sessão inválida
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - liveViewerToken: []
      summary: Snapshot público do estado ao vivo (sem SSE)
      tags:
      - ao-vivo (público)
  /api/publico/eventos/{id}/ao-vivo/fluxo:
    get:
      description: "Server-Sent Events: um frame liveSnapshotDTO ao conectar, de novo
        a cada mudança, e um heartbeat a cada 15s. Também emite eventos nomeados \"reaction\"
        (\\{\"emoji\":\"\U0001F44D\"\\}) para reações ao vivo. Não dá pra \"experimentar\"
        pelo Swagger UI (conexão fica aberta); consuma com EventSource no navegador."
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Token de visitante
        in: query
        name: token
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.liveSnapshotDTO'
        "401":
          description: sessão inválida
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - liveViewerToken: []
      summary: Stream (SSE) do estado ao vivo, para participantes/observadores
      tags:
      - ao-vivo (público)
  /api/publico/eventos/{id}/ao-vivo/perguntas:
    post:
      consumes:
      - application/json
      description: Fica só na caixa privada do organizador — nunca aparece pra outros
        participantes. clientId (opcional) permite remover a própria mensagem depois.
        Exige interações habilitadas no evento.
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Token de visitante
        in: query
        name: token
        required: true
        type: string
      - description: Mensagem
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.liveSubmitQARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.enviarPerguntaAoVivoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: sessão inválida
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: interações desativadas
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - liveViewerToken: []
      summary: Envia uma pergunta/recado para a caixa de Q&A do organizador
      tags:
      - ao-vivo (público)
  /api/publico/eventos/{id}/ao-vivo/perguntas/{messageId}:
    delete:
      consumes:
      - application/json
      description: 'Só quem enviou pode remover: o clientId do corpo precisa bater
        com o clientId salvo no envio.'
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: ID da mensagem de Q&A
        in: path
        name: messageId
        required: true
        type: string
      - description: Token de visitante
        in: query
        name: token
        required: true
        type: string
      - description: clientId de quem enviou
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.removerPerguntaAoVivoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.okResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - liveViewerToken: []
      summary: Remove a própria pergunta/recado de Q&A
      tags:
      - ao-vivo (público)
  /api/publico/eventos/{id}/ao-vivo/reagir:
    post:
      consumes:
      - application/json
      description: "emoji precisa ser um dos permitidos: \U0001F44D ❤️ \U0001F602
        \U0001F389 \U0001F44F. Exige interações habilitadas no evento."
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Token de visitante
        in: query
        name: token
        required: true
        type: string
      - description: emoji
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.liveReactRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.okResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: sessão inválida
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: interações desativadas
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - liveViewerToken: []
      summary: Manda uma reação de emoji (efêmera, não grava no banco)
      tags:
      - ao-vivo (público)
  /api/publico/eventos/{id}/enviar:
    post:
      consumes:
      - application/json
      description: Público, sem sessão. Sem editToken, identifica por e-mail (cria
        um novo participante, ou falha se o evento não permitir reenvio). Com editToken,
        edita as respostas já enviadas — exige allowEdit habilitado no evento. answers
        deve cobrir todas as perguntas do evento.
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Identificação + respostas
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.submitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.enviarRespostasResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: respostas fechadas, edição desabilitada, ou já respondeu
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: Envia (ou edita) as respostas de um participante
      tags:
      - publico
  /api/publico/eventos/{id}/participante:
    get:
      description: Público, sem sessão — o token é o único segredo que autoriza. Usado
        para pré-preencher o formulário quando a pessoa volta para editar.
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Token do link de edição
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.publicoParticipanteEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: link inválido ou expirado
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: Busca as respostas de um participante pelo link de edição
      tags:
      - publico
  /api/publico/eventos/por-pin:
    get:
      description: Público, sem sessão. Usado pela tela inicial antes de avançar para
        /responder/{id} ou /plateia/{id}.
      parameters:
      - description: PIN do evento
        in: query
        name: pin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.pinResolvidoResponse'
        "404":
          description: código não encontrado
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: Resolve o ID de um evento a partir do PIN
      tags:
      - publico
  /api/publico/redefinir-senha:
    get:
      description: Público, sem sessão. Usado por /redefinir-senha antes de mostrar
        o formulário de nova senha.
      parameters:
      - description: Token do link gerado pelo super admin
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.validTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: link inválido ou expirado
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: Valida um link de redefinição de senha
      tags:
      - conta
    post:
      consumes:
      - application/json
      description: Público, sem sessão. O token é de uso único e expira em 1h.
      parameters:
      - description: Token e nova senha
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.redefinirSenhaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.okResponse'
        "400":
          description: link inválido/expirado ou senha fora das regras
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: Define uma nova senha a partir do link de redefinição
      tags:
      - conta
securityDefinitions:
  cookieAuth:
    in: header
    name: Cookie
    type: apiKey
  liveViewerToken:
    in: query
    name: token
    type: apiKey
swagger: "2.0"
