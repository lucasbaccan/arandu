          EditToken permite voltar depois e editar as mesmas respostas (link
          pessoal, sem login) — só presente quando o evento permite edição.
        type: string
      ok:
        type: boolean
    type: object
  api.errorResponse:
    properties:
      error:
        type: string
    type: object
  api.eventDTO:
    properties:
      allowEdit:
        type: boolean
      configShowRanking:
        type: boolean
      createdAt:
        type: string
      id:
        type: string
      interactionsEnabled:
        type: boolean
      ownerId:
        type: string
      participantCount:
        type: integer
      pinCode:
        type: string
