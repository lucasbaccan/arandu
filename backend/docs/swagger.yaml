        type: boolean
    type: object
info:
  contact: {}
  description: |-
    API REST do Arandu (coleta de respostas, apresentação ao vivo e administração de eventos) — as mesmas rotas usadas pelo frontend embutido, prontas para chamar diretamente e criar/gerenciar recursos por API.

    Autenticação de organizador (cookieAuth): faça login em outra aba pelo próprio app (POST /api/conta/entrar) — o cookie de sessão é httpOnly, então não dá para colá-lo aqui manualmente, mas o navegador o envia sozinho nas chamadas desta página por estarem na mesma origem.
    Visitante ao vivo (liveViewerToken): obtenha o token em POST /api/publico/eventos/{id}/ao-vivo/entrar e cole em "Authorize" — o Swagger UI passa a anexar "?token=" nas chamadas das rotas públicas de ao-vivo.
  license:
    name: Uso interno
  title: Arandu API
  version: "1.0"
paths:
  /api/admin/configuracoes:
    get:
      description: Somente super admin. Hoje só tem o toggle de cadastro aberto.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.adminConfigResponse'
        "403":
          description: acesso restrito ao super admin
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - cookieAuth: []
      summary: Configurações administrativas
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Somente super admin. Liga/desliga o cadastro de novas contas organizadoras.
      parameters:
      - description: Nova configuração
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.updateAdminConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.adminConfigResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: acesso restrito ao super admin
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - cookieAuth: []
      summary: Atualiza configurações administrativas
      tags:
      - admin
  /api/admin/eventos:
    get:
      description: Somente super admin.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.adminEventsResponse'
        "403":
          description: acesso restrito ao super admin
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - cookieAuth: []
      summary: Lista todos os eventos, de todos os organizadores
      tags:
      - admin
  /api/admin/usuarios:
    get:
      description: Somente super admin — cada usuário vem com sua contagem de eventos.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.adminUsersResponse'
        "403":
          description: acesso restrito ao super admin
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - cookieAuth: []
      summary: Lista todos os usuários
      tags:
      - admin
  /api/admin/usuarios/{id}:
    delete:
      description: Somente super admin. Quem está agindo não pode se auto-excluir
        por aqui.
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.okResponse'
        "400":
          description: auto-exclusão bloqueada
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: acesso restrito ao super admin
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - cookieAuth: []
      summary: Exclui um usuário (e seus eventos)
      tags:
      - admin
  /api/admin/usuarios/{id}/link-redefinicao:
    post:
      description: Somente super admin. Token de uso único, válido por 1h — o admin
        copia e envia por fora (o app não envia nada); gerar de novo invalida o anterior.
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.adminResetLinkResponse'
        "403":
          description: acesso restrito ao super admin
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - cookieAuth: []
      summary: Gera um link de redefinição de senha para um usuário
      tags:
      - admin
  /api/conta/configuracao:
    get:
      description: Tamanho mínimo de senha e se o cadastro de novas contas está aberto
        — checado por /criar-conta antes de mostrar o formulário.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.contaConfiguracaoResponse'
      summary: Configuração pública de conta
      tags:
      - conta
  /api/conta/criar-conta:
    post:
      consumes:
      - application/json
      description: Cria a conta e já abre sessão (cookie). Falha se o cadastro estiver
        desativado (GET /api/conta/configuracao) ou o e-mail já existir.
      parameters:
      - description: Nome, e-mail e senha
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.userEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: cadastro desativado
          schema:
            $ref: '#/definitions/api.errorResponse'
        "409":
          description: e-mail já cadastrado
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: Cria uma conta de organizador
      tags:
      - conta
  /api/conta/entrar:
    post:
      consumes:
      - application/json
      description: Autentica por e-mail e senha e abre sessão (cookie httpOnly).
      parameters:
      - description: E-mail e senha
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.userEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: e-mail ou senha inválidos
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: Login de organizador
      tags:
      - conta
  /api/conta/eu:
    get:
      description: Devolve quem está logado nesta sessão — usado pelo frontend pra
        saber se/quem está autenticado ao carregar.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.userEnvelope'
        "401":
          description: sessão inválida
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - cookieAuth: []
      summary: Organizador autenticado
      tags:
      - conta
  /api/conta/sair:
    post:
      responses:
        "204":
          description: sessão encerrada
      summary: Logout do organizador
      tags:
      - conta
  /api/conta/trocar-senha:
    post:
      consumes:
      - application/json
      description: Não pede a senha atual — quem está autenticado já pode trocar.
      parameters:
      - description: Nova senha
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.trocarSenhaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.okResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - cookieAuth: []
      summary: Troca a senha do organizador logado
      tags:
      - conta
  /api/eventos:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.eventsEnvelope'
      security:
      - cookieAuth: []
      summary: Lista os eventos do organizador autenticado
      tags:
      - eventos
    post:
      consumes:
      - application/json
      description: Sem pinCode, gera um PIN numérico de 6 dígitos automaticamente.
      parameters:
      - description: Título e (opcional) PIN
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.eventEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "409":
          description: PIN em uso
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - cookieAuth: []
      summary: Cria um evento
      tags:
      - eventos
  /api/eventos/{id}:
    delete:
      description: Dono do evento ou super admin. Apaga em cascata perguntas, participantes
        e respostas.
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.okResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - cookieAuth: []
      summary: Exclui um evento
      tags:
      - eventos
    get:
      description: Dono do evento ou super admin — qualquer outro recebe 404 (não
        revela que o evento existe).
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.eventEnvelope'
        "400":
          description: Bad Request
          schema:
