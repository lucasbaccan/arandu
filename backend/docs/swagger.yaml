        type: string
      options:
        items:
          $ref: '#/definitions/api.publicOptionDTO'
        type: array
      title:
        type: string
      type:
        type: string
    type: object
  api.publicoEventoResponse:
    properties:
      event:
        $ref: '#/definitions/api.publicEventDTO'
      questions:
        items:
          $ref: '#/definitions/api.publicQuestionDTO'
        type: array
    type: object
  api.publicoParticipanteEnvelope:
    properties:
      participant:
        $ref: '#/definitions/api.publicParticipantDTO'
    type: object
  api.questionDTO:
    properties:
      eventId:
        type: string
      id:
        type: string
      layoutView:
        type: string
      options:
        items:
          $ref: '#/definitions/api.questionOptionDTO'
        type: array
      orderIndex:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  api.questionEnvelope:
    properties:
      question:
        $ref: '#/definitions/api.questionDTO'
    type: object
  api.questionOptionDTO:
    properties:
      id:
        type: string
      text:
        type: string
    type: object
  api.questionsEnvelope:
    properties:
      questions:
        items:
          $ref: '#/definitions/api.questionDTO'
        type: array
    type: object
  api.redefinirSenhaRequest:
    properties:
      novaSenha:
        type: string
      token:
        type: string
    type: object
  api.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  api.removerPerguntaAoVivoRequest:
    properties:
      clientId:
        type: string
    type: object
  api.reorderQuestionsRequest:
    properties:
      questionIds:
        items:
          type: string
        type: array
    type: object
  api.respostasEnvelope:
    properties:
      participantCount:
        type: integer
      participants:
        items:
          $ref: '#/definitions/api.participantResponseDTO'
        type: array
    type: object
  api.submitAnswerRequest:
    properties:
      optionId:
        type: string
      questionId:
        type: string
      text:
        type: string
    type: object
  api.submitRequest:
    properties:
      answers:
        items:
          $ref: '#/definitions/api.submitAnswerRequest'
        type: array
      editToken:
        type: string
      email:
        type: string
      name:
        type: string
      photo:
        type: string
    type: object
  api.trocarSenhaRequest:
    properties:
      novaSenha:
        type: string
    type: object
  api.updateAdminConfigRequest:
    properties:
      registrationEnabled:
