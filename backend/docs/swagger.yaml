    type: object
  api.userDTO:
    properties:
      authProvider:
        type: string
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  api.userEnvelope:
    properties:
      user:
        $ref: '#/definitions/api.userDTO'
