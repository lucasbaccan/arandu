  api.liveSnapshotDTO:
    properties:
      answersHidden:
        type: boolean
      blanked:
        type: boolean
      currentQuestionId:
        type: string
      eventTitle:
        type: string
      groups:
        items:
          $ref: '#/definitions/api.liveGroupDTO'
        type: array
      interactionsEnabled:
        type: boolean
      message:
        type: string
      namesHidden:
        type: boolean
      pending:
        items:
