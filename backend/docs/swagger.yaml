  api.liveSetAnswersHiddenRequest:
    properties:
      hidden:
        type: boolean
    type: object
  api.liveSetBlankedRequest:
    properties:
      blanked:
        type: boolean
    type: object
  api.liveSetInteractionsRequest:
    properties:
      enabled:
        type: boolean
    type: object
  api.liveSetMessageRequest:
    properties:
      message:
        type: string
    type: object
  api.liveSetNamesHiddenRequest:
    properties:
