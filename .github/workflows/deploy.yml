name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH → git sync → docker compose up --build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              "${{ vars.VPS_SSH_USER }}@${{ vars.VPS_HOST }}" << 'ENDSSH'
            set -e
            cd ~/arandu
            git fetch origin master
            git reset --hard origin/master
            export GIT_COMMIT=$(git rev-parse --short HEAD)
            if docker inspect arandu >/dev/null 2>&1; then
              wd="$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' arandu 2>/dev/null || true)"
              if [ "$wd" != "$(pwd)" ]; then docker rm -f arandu; fi
            fi
            docker compose up -d --build --remove-orphans
          ENDSSH
