services:
  arandu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Commit curto exibido na UI (buildInfo). Vem do shell (deploy.yml
        # exporta GIT_COMMIT); sem ele, "dev".
        GIT_COMMIT: "${GIT_COMMIT:-dev}"
    image: arandu:latest
    container_name: arandu
    restart: unless-stopped
    # Sem porta publicada: o Traefik alcança o container pela rede interna
    # server-vps_default (rota http://arandu:8080).
    networks:
      - server-vps_default
    environment:
      # Gere um segredo forte com: openssl rand -hex 32
      JWT_SECRET: "${JWT_SECRET:-mude-este-segredo}"
      SESSION_HOURS: "${SESSION_HOURS:-24}"
      MIN_PASSWORD_LENGTH: "${MIN_PASSWORD_LENGTH:-3}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      COOKIE_SAMESITE: "${COOKIE_SAMESITE:-lax}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      SNOWFLAKE_NODE: "${SNOWFLAKE_NODE:-0}"
    volumes:
      # Banco SQLite + fotos materializadas — sobrevivem a recreated do container.
      - arandu_data:/app/data

networks:
  server-vps_default:
    external: true

volumes:
  # Nome fixo (não deriva do diretório): renomear/mover a pasta do projeto
  # não troca o volume — os dados (SQLite + fotos) sempre ficam em arandu_data.
  arandu_data:
    name: arandu_data
